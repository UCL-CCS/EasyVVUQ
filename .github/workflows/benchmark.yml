name: Benchmark

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --editable .[tests]
        # Build cannonsim if needed for tests
        if [ -d "tests/cannonsim/src" ]; then
          cd tests/cannonsim/src && make && cd ../../..
        fi
    - name: Benchmark with pytest
      run: |
        pytest tests/test_db_benchmark.py --benchmark-json output.json
    - name: Store benchmark result
      uses: rhysd/github-action-benchmark@v1
      with:
        tool: 'pytest'
        output-file-path: output.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        gh-pages-branch: benchmark-data
        # Only push to gh-pages on dev branch to avoid conflicts
        alert-threshold: '200%'
        comment-on-alert: true
        fail-on-alert: false

